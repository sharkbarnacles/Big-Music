name: Probe YouTube Music
# Manual: saves YouTube Music's raw answers to the side branch `probe-output`
# (never main), so the hub's parsers can be written against real data.
on:
  workflow_dispatch:
    inputs:
      q:
        description: Search words
        default: matryoshka hachi
      script:
        description: Which probe (search / artist / disco / radio)
        default: search
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: inputs.script == 'disco'
        run: npx -y tsx scripts/try_disco.mts
        env: { Q: "${{ inputs.q }}" }
      - if: inputs.script == 'radio'
        run: npx -y tsx scripts/try_radio.mts
        env: { Q: "${{ inputs.q }}" }
      - if: inputs.script == 'artist'
        run: node scripts/probe_artist.mjs
        env: { Q: "${{ inputs.q }}" }
      - if: inputs.script == 'search' || inputs.script == ''
        run: node scripts/probe_ytm.mjs
        env: { Q: "${{ inputs.q }}" }
      - name: Save to probe-output branch
        if: inputs.script == 'search' || inputs.script == ''
        run: |
          mv probe /tmp/probe
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rq --cached . && rm -rf ./*
          cp /tmp/probe/* . && git add *.json && git commit -qm "probe" && git push -f origin probe-output
