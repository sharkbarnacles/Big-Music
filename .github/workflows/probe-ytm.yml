name: Probe YouTube Music
on:
  workflow_dispatch:
    inputs:
      q:
        description: Search words
        default: matryoshka hachi
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe_ytm.mjs
        env: { Q: "${{ inputs.q }}" }
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: probe/, retention-days: 3 }
