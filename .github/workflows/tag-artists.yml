# Tags your artists from MusicBrainz (genres, tags, country, solo/group,
# vocal gender) for the taste profile, favourites first. MusicBrainz allows
# one request a second. The first big pass is done (13k+ artists by
# 2026-11-09), so it now runs every 6 hours for up to 15 minutes to pick up
# new artists. (Hourly 50-minute runs used up GitHub's free minutes on
# 2026-11-05 while the repo was private and blocked every job until it went public.)
name: Tag artists

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: tag-artists
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Tag artists
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/tag_artists.py --minutes 15
