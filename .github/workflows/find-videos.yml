# Finds music videos and YouTube audio versions (for YouTube mode) for your
# songs, in GitHub's cloud — no computer needed.
# Runs every 3 hours, and any time you tap "Run workflow"
# (GitHub app → this repo → Actions → Find music videos → Run workflow).
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL         e.g. https://xxxx.supabase.co
#   SUPABASE_SECRET_KEY  the sb_secret_… key from Supabase → Project Settings → API Keys

name: Find music videos and YouTube versions

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours; once the library is done, each run takes about a minute
  workflow_dispatch:
    inputs:
      recheck:
        description: 'Retry songs where nothing was found before'
        type: boolean
        default: false
      limit:
        description: 'Stop after this many songs (0 = all)'
        type: string
        default: '0'

# Only one run at a time: a scheduled run waits for a manual one to finish
# (and vice versa), so the same songs are never checked twice.
concurrency:
  group: find-videos
  cancel-in-progress: false

jobs:
  find-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install -r scripts/requirements.txt

      - name: Find videos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          ARGS="--limit ${{ inputs.limit || '0' }}"
          if [ "${{ inputs.recheck }}" = "true" ]; then ARGS="$ARGS --recheck"; fi
          python scripts/find_videos.py $ARGS
